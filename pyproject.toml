[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
env = [
  "D:DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/payments_test",
  "API_KEY=test-key",
  "DOCS_USERNAME=docs",
  "DOCS_PASSWORD=docs-secret",
  "RABBITMQ_URL=amqp://guest:guest@localhost:5672/",
]

[tool.ruff]
line-length = 100
target-version = "py313"
